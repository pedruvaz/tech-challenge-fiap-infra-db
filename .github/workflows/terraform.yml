# CI/CD da infraestrutura do banco gerenciado.
#
# Depende do `infra-k8s`: esta stack lê VPC, subnets e o SG do cluster via
# `terraform_remote_state`. Se o pipeline do `infra-k8s` nunca rodou, o plan
# aqui falha com "Unable to find remote state" — é ordem de execução, não bug.
#
# Pré-requisitos (uma vez — ver README):
#   Secret  AWS_TERRAFORM_ROLE_ARN   output `github_terraform_role_arn` do infra-k8s
#   Var     AWS_REGION               ex.: us-east-1
#   Secret  NEWRELIC_LICENSE_KEY     opcional — vira NR_LICENSE_KEY no segredo da API
#                                    (var `newrelic_license_key`); sem ele a chave
#                                    fica fora do JSON e a telemetria fica desligada
name: Terraform

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: terraform-infra-db
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: '1.13.3'
  TF_IN_AUTOMATION: 'true'

defaults:
  run:
    working-directory: terraform

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

  plan:
    name: Plan
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      # continue-on-error: enquanto o `infra-k8s` não tiver rodado, não existe
      # state do cluster para ler e o plan falha. Esperado antes do primeiro
      # apply da cadeia — não deve reprovar a revisão do PR.
      - name: Terraform plan
        id: plan
        continue-on-error: true
        env:
          TF_VAR_newrelic_license_key: ${{ secrets.NEWRELIC_LICENSE_KEY }}
        run: terraform plan -no-color -input=false -lock-timeout=5m

      - name: Comenta o plan no PR
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const body = [
              '### Terraform plan — `infra-db`',
              '',
              'Resultado: **' + process.env.OUTCOME + '**',
              '',
              'Log completo na aba Actions desta execução.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  apply:
    name: Apply
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        env:
          TF_VAR_newrelic_license_key: ${{ secrets.NEWRELIC_LICENSE_KEY }}
        run: terraform apply -auto-approve -input=false -lock-timeout=5m

      # `-json` nos outputs não-sensíveis: o endpoint do banco é sensitive e o
      # Terraform já o omite do log. Nada de credencial no summary.
      - name: Resumo
        run: |
          {
            echo "### infra-db aplicado"
            echo '```'
            echo "secret:     $(terraform output -raw api_secret_name)"
            echo "db_name:    $(terraform output -raw db_name)"
            echo "lambda_sg:  $(terraform output -raw lambda_security_group_id)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
